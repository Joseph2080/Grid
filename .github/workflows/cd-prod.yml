name: CD Production

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
  DEPLOY_ASSET_BUCKET: ${{ vars.DEPLOY_ASSET_BUCKET }}
  SSM_PARAMETER_PATH_PREFIX: ${{ vars.SSM_PARAMETER_PATH_PREFIX }}
  APP_PORT: ${{ vars.APP_PORT || '8080' }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}
      asset_key: ${{ steps.meta.outputs.asset_key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "${ECR_REPOSITORY}" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "${ECR_REPOSITORY}" >/dev/null

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push application image
        id: meta
        run: |
          IMAGE_TAG="${GITHUB_SHA::12}"
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}"
          docker build -t "${IMAGE_URI}:${IMAGE_TAG}" -t "${IMAGE_URI}:latest" .
          docker push "${IMAGE_URI}:${IMAGE_TAG}"
          docker push "${IMAGE_URI}:latest"
          ASSET_KEY="vektrlabs/deploy-assets/${GITHUB_SHA}.tgz"
          echo "image_tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "asset_key=${ASSET_KEY}" >> "${GITHUB_OUTPUT}"

      - name: Package and upload deploy assets
        run: |
          tar -czf deploy-assets.tgz docker-compose.prod.yml scripts/deploy-on-ec2.sh scripts/render-env-from-ssm.sh
          aws s3 cp deploy-assets.tgz "s3://${DEPLOY_ASSET_BUCKET}/${{ steps.meta.outputs.asset_key }}"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-publish
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Deploy to EC2 with SSM
        run: |
          COMMAND_ID="$(
            aws ssm send-command \
              --region "${AWS_REGION}" \
              --instance-ids "${EC2_INSTANCE_ID}" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy ${GITHUB_SHA} to Vektrlabs production" \
              --parameters "commands=[
                \"set -euo pipefail\",
                \"sudo mkdir -p /opt/vektrlabs\",
                \"sudo chown -R ec2-user:ec2-user /opt/vektrlabs\",
                \"aws s3 cp s3://${DEPLOY_ASSET_BUCKET}/${{ needs.build-and-publish.outputs.asset_key }} /tmp/vektrlabs-deploy-assets.tgz\",
                \"tar -xzf /tmp/vektrlabs-deploy-assets.tgz -C /opt/vektrlabs\",
                \"chmod +x /opt/vektrlabs/scripts/*.sh\",
                \"cd /opt/vektrlabs\",
                \"AWS_REGION=${AWS_REGION} ECR_REGISTRY=${{ needs.build-and-publish.outputs.ecr_registry }} ECR_REPOSITORY=${ECR_REPOSITORY} IMAGE_TAG=${{ needs.build-and-publish.outputs.image_tag }} SSM_PARAMETER_PATH_PREFIX=${SSM_PARAMETER_PATH_PREFIX} APP_PORT=${APP_PORT} ./scripts/deploy-on-ec2.sh\"
              ]" \
              --query "Command.CommandId" \
              --output text
          )"

          aws ssm wait command-executed \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}"

          STATUS="$(aws ssm get-command-invocation \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query 'Status' \
            --output text)"

          STDOUT="$(aws ssm get-command-invocation \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query 'StandardOutputContent' \
            --output text)"

          STDERR="$(aws ssm get-command-invocation \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query 'StandardErrorContent' \
            --output text)"

          echo "${STDOUT}"
          if [[ "${STATUS}" != "Success" ]]; then
            echo "${STDERR}" >&2
            exit 1
          fi
